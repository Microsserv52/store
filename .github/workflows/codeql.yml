name: CodeQL
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    if: github.event.repository.private == false || vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
