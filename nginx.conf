server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /health { access_log off; return 200 "ok"; add_header Content-Type text/plain; }
    location /store/_next/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
    error_page 404 /store/404.html;
}

